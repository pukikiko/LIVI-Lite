[workspace]
resolver = "2"
members = [
    "crates/imx6ul-uboot",
    "crates/livi-btd",
    "crates/livi-iapd",
    "crates/livi-link-provision",
    "crates/livi-mdns",
    "crates/livi-web",
    "crates/livi-wifid",
    "bin/livi-link-provision",
    "bin/livid",
    "bin/mkbootimg-v821b",
]

[workspace.package]
edition = "2024"

# Every crate takes libc from here, so all of them follow the 1.0 API.
[workspace.dependencies]
libc = "1.0.0-alpha.5"

[profile.embedded]
inherits = "release"
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
lto = true
