[package]
name = "livi-link-provision-cli"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "livi-link-provision"
path = "src/main.rs"

[dependencies]
livi-link-provision = { path = "../../crates/livi-link-provision" }
livi-link-host = { path = "../../../livi-helperd/crates/livi-link-host" }
livi-session-io = { path = "../../../livi-helperd/crates/livi-session-io" }
nusb = "0.2"
tokio = { version = "1", features = ["rt", "io-util", "time"] }
