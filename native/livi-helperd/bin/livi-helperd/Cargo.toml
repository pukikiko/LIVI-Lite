[package]
name = "livi-helperd"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "livi-helperd"
path = "src/main.rs"

[dependencies]
livi-runtime = { path = "../../crates/livi-runtime" }
livi-wifi = { path = "../../crates/livi-wifi" }
livi-net = { path = "../../crates/livi-net" }
iap2-csm = { path = "../../crates/iap2-csm" }
iap2-mfi = { path = "../../crates/iap2-mfi" }
iap2-link = { path = "../../crates/iap2-link" }
livi-aa = { path = "../../crates/livi-aa" }
livi-link-host = { path = "../../crates/livi-link-host" }
iap2-usbmux = { path = "../../crates/iap2-usbmux" }
iap2-wired = { path = "../../crates/iap2-wired" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
serde_json = "1"
libc.workspace = true
nusb = "0.2"

