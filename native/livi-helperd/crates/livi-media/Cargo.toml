[package]
name = "livi-media"
version = "0.1.0"
edition.workspace = true

[dependencies]
livi-core-proto = { path = "../livi-core-proto" }
livi-host-proto = { path = "../../../livi-host-proto/rust" }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "io-util", "sync", "time", "process"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "test-util"] }
