[package]
name = "livi-ui"
version = "0.1.0"
edition = "2021"
description = "LIVI-Lite native UI (Slint, software renderer)"
license = "GPL-3.0-only"

# Standalone crate: do not inherit any parent workspace.
[workspace]

[[bin]]
name = "livi-ui"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
